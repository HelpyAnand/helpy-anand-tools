<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        AI Text Rewriter - Rewrite Text with AI Free | Helpy Anand Tools
    </title>

    <meta
        name="description"
        content="Rewrite and improve your text using AI for free. Make your writing clear, natural and professional with Helpy Anand AI Text Rewriter.">

    <meta
        name="robots"
        content="index, follow">

    <link
        rel="canonical"
        href="https://helpy-anand-tools.vercel.app/ai-tools/text-rewriter/">

    <link
        rel="stylesheet"
        href="style.css">
        <link rel="stylesheet" href="/common.css">

</head>

<body>

    <!-- Common Navbar -->
    <div id="common-navbar"></div>


    <main>

        <section class="hero">

            <div class="container">

                <h2>
                    ✨ AI Text Rewriter
                </h2>

                <p>
                    Rewrite and improve your text with AI for free.
                </p>

            </div>

        </section>


        <section class="tool-section">

            <div class="tool-container">

                <h1>
                    AI Text Rewriter
                </h1>

                <p class="tool-description">
                    Enter your text below and let AI rewrite it
                    in a clear and natural way.
                </p>


                <!-- Input -->

                <div class="text-box">

                    <label for="inputText">
                        Enter Your Text
                    </label>

                    <textarea
                        id="inputText"
                        placeholder="Enter or paste your text here..."></textarea>

                    <div class="character-count">
                        <span id="charCount">0</span>
                        characters
                    </div>

                </div>


                <!-- Button -->

                <div class="button-group">

                    <button id="rewriteBtn">
                        ✨ Rewrite with AI
                    </button>

                    <button id="clearBtn">
                        Clear
                    </button>

                </div>


                <!-- Status -->

                <p
                    id="statusMessage"
                    class="status-message">
                </p>


                <!-- Output -->

                <div class="text-box output-box">

                    <div class="output-header">

                        <label>
                            AI Rewritten Text
                        </label>

                        <button
                            id="copyBtn"
                            disabled>
                            📋 Copy
                        </button>

                    </div>

                    <textarea
                        id="outputText"
                        readonly
                        placeholder="Your rewritten text will appear here..."></textarea>

                </div>

            </div>

        </section>

    </main>


    <!-- Common JavaScript -->

    <script src="/js/common.js"></script>

    <!-- Tool JavaScript -->

    <script src="script.js"></script>

</body>

</html>
