
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PDF to Word Converter - Convert PDF to Word Online Free | Helpy Anand Tools
    </title>

    <meta
        name="description"
        content="Convert PDF to Word online with our free PDF to Word converter. Convert PDF files to editable DOCX documents while preserving the original layout."
    >

 <link
    rel="stylesheet"
    href="../../css/style.css"
>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

    <!-- Navbar -->
<div id="common-navbar"></div>


    <main class="pdf-word-page">

        <section class="converter-container">

            <div class="converter-header">

                <h1>
                    PDF to Word Converter
                </h1>

                <p>
                    Convert PDF to editable Word (DOCX) online
                    while preserving the original layout.
                </p>

            </div>


            <!-- Upload Box -->

            <div
                class="upload-box"
                id="uploadBox"
            >

                <div class="upload-icon">
                    📄
                </div>

                <h2>
                    Select PDF File
                </h2>

                <p>
                    Choose a PDF file from your device
                </p>

                <label
                    for="pdfFile"
                    class="choose-btn"
                >
                    Choose PDF
                </label>

                <input
                    type="file"
                    id="pdfFile"
                    accept="application/pdf,.pdf"
                    hidden
                >

                <p
                    class="file-info"
                    id="fileInfo"
                >
                    No file selected
                </p>

            </div>


            <!-- Convert Button -->

            <button
                type="button"
                id="convertBtn"
                class="convert-btn"
                disabled
            >
                Convert PDF to Word
            </button>


            <!-- Progress -->

            <div
                class="progress-box"
                id="progressBox"
                hidden
            >

                <div
                    class="progress-text"
                    id="progressText"
                >
                    Preparing conversion...
                </div>

                <div class="progress-track">

                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>

                </div>

            </div>


            <!-- Result / Error -->

            <div
                class="status-message"
                id="statusMessage"
                aria-live="polite"
            ></div>


            <div class="converter-note">

                <strong>
                    Note:
                </strong>

                Your PDF is converted into an editable
                Microsoft Word (DOCX) file.

            </div>

        </section>

    </main>


    <!-- Footer -->
   <div id="common-footer"></div>
<script src="../../js/common.js"></script>
 <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
    import * as docxLib from "https://cdn.jsdelivr.net/npm/docx@9.5.1/+esm";

    window.pdfjsLib = pdfjsLib;
    window.docx = docxLib;

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    console.log("PDF.js LOADED:", !!window.pdfjsLib);
    console.log("DOCX LOADED:", !!window.docx);

    await import("./script.js");
</script>
</body>

</html>
