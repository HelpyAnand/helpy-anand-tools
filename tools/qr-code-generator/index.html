<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

    <div class="container header-container">

        <div class="logo">

            <a href="../../index.html" class="logo-link">

                <img src="../../favicon-32x32.png"
                     class="logo-icon"
                     alt="Helpy Anand Tools">

                <h1>Helpy Anand Tools</h1>

            </a>

        </div>

        <nav>

            <a href="../../index.html">Home</a>

            <a href="../../about.html">About</a>

            <a href="../../contact.html">Contact</a>

        </nav>

    </div>

</header>

<main class="tool-section">

<div class="tool-box">

    <h2>📱 QR Code Generator</h2>

    <p class="tool-desc">
        Generate QR Codes instantly for URLs, Text and More.
    </p>

    <input
        type="text"
        id="qrText"
        placeholder="Enter Text or Website URL">

    <div id="imgBox">

        <img id="qrImage" alt="QR Code">

    </div>

    <div class="buttons">

        <button onclick="generateQR()">
            Generate QR
        </button>

        <button onclick="downloadQR()">
            Download
        </button>

        <button onclick="clearQR()">
            Reset
        </button>

    </div>

</div>

</main>


<script src="script.js"></script>

<footer>

    <p class="copyright">

        © 2026 Helpy Anand Tools | Version 1.0

    </p>

</footer>

</body>
</html>
